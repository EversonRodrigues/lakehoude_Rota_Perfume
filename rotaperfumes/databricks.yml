# Declarative Automation Bundle do lakehouse Rota Perfume.
# https://docs.databricks.com/dev-tools/bundles/index.html
#
# NENHUM valor deste arquivo aponta para um workspace especifico.
#
# O ENDERECO DO WORKSPACE NAO APARECE AQUI de proposito, e nao e esquecimento:
# `workspace.host` e resolvido ANTES das variaveis do bundle (e configuracao de
# autenticacao), entao `${var.alguma_coisa}` ali falha com "invalid character
# '{' in host name". Quem informa o host e o `--profile`, lido do seu
# ~/.databrickscfg, que nunca entra no repositorio. Por isso todo comando deste
# projeto passa `--profile <nome>` explicitamente.
#
# O que sobra de identidade (e-mail e warehouse) e VARIAVEL sem default: voce
# preenche uma vez, num arquivo que o git ignora, e todo comando enxerga:
#
#     .\scripts\configurar.ps1            (copia o modelo)
#     notepad .databricks\bundle\dev\variable-overrides.json
bundle:
  name: rotaperfumes
  uuid: d7dd926b-6f56-4cf8-bcd8-4a7e4a60e0e3

include:
  - resources/*.yml

variables:
  # ---- Identidade do SEU workspace. Sem default de proposito: um default aqui
  # ---- seria exatamente o dado que a gente quer manter fora do repositorio,
  # ---- e um valor errado deploya em cima do workspace de outra pessoa.
  workspace_user:
    description: |
      E-mail da conta que faz o deploy. Vira o dono do bundle em prod.
      `databricks current-user me --profile <perfil>` mostra o seu.
  warehouse_id:
    description: |
      SQL Warehouse usado pelos scripts, pelo Genie e pelas conferencias.
      `databricks warehouses list --profile <perfil>` lista os seus.

  # ---- Nomes do projeto. Estes TEM default, porque sao escolha de projeto e
  # ---- nao segredo de ninguem. Troque se quiser outro catalogo.
  catalog:
    description: Catalogo do Unity Catalog que recebe bronze/silver/gold
    default: lakehouse_rotaperfume
  schema:
    description: Sufixo de ambiente usado pelos recursos que precisam distinguir dev de prod
    default: dev

targets:
  dev:
    # ARMADILHA (nao coloque `mode: development` aqui):
    # o modo development prefixa o nome de TODO recurso com '[dev seu_usuario]' --
    # inclusive os SCHEMAS do Unity Catalog, que virariam `dev_fulano_bronze`
    # e quebrariam cada referencia SQL escrita a mao (bronze.clientes, etc).
    # Como este bundle declara schemas como recurso, o modo fica de fora.
    # Para nao agendar de verdade em dev, pausamos o schedule explicitamente
    # com o preset abaixo -- que era o unico efeito do modo que a gente queria.
    presets:
      trigger_pause_status: PAUSED
    default: true
    variables:
      schema: dev
  prod:
    mode: production
    workspace:
      # Caminho explicito para garantir UMA copia so do bundle no workspace.
      root_path: /Workspace/Users/${var.workspace_user}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: prod
    permissions:
      - user_name: ${var.workspace_user}
        level: CAN_MANAGE
