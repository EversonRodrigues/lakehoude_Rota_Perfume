# O job da Rota Perfume. Uma tarefa por entrega -- ele cresce ao longo das seis
# noites, sempre neste arquivo:
#
#   1. raw_conferencia   [feito] entrega 1: os 10 arquivos chegaram ao Volume?
#   2. bronze_ingestao   [feito] entrega 2: Volume -> tabelas bronze, uma por
#                                arquivo, e a contagem tem que fechar com a
#                                conferencia de chegada
#   3. silver_*          [feito] entrega 3: limpeza, tipagem e o contrato em
#                                CHECK constraint -- quatro tarefas SQL que
#                                rodam EM PARALELO entre si
#   4. gold_* + testes   [feito] entrega 4: dimensoes conformadas, fato_vendas
#                                no grao de item, tres marts por diretoria e os
#                                9 testes que PARAM o job -- encadeadas, nao
#                                paralelas, e `testes` e sempre a ultima
#   5. dashboard         [feito] entrega 5: o AI/BI comercial como recurso do
#                                bundle (resources/dashboard.dashboard.yml)
#
# NOITE 3 -- a camada de ML entra no MESMO pipeline, nao num projeto separado:
#   6. ml_features       [feito] features de cliente com data de corte por
#                                parametro: gold.features_treino e
#                                gold.features_cliente
#   7. ml_modelo         [feito] o modelo registrado no UC, os 3 testes que
#                                desconfiam do sucesso, e gold.score_propensao
#   8. ml_fila           [feito] gold.fila_semanal -- as 200 ligacoes com nome,
#                                motivo em portugues e o que oferecer -- mais as
#                                quatro funcoes que o agente consulta
#
# NOITE 4 -- o caminho de VOLTA, e a regra de metadado virando tarefa:
#   9. gold_retorno_ligacao   [feito] entrega 9: gold.retorno_ligacao, a unica
#                                tabela alimentada pelo TIME e nao pelo
#                                pipeline -- por isso IF NOT EXISTS, e por isso
#                                nasce vazia
#  10. auditoria_de_metadado  [feito] entrega 9: quebra o job se qualquer
#                                tabela ou coluna da gold estiver sem COMMENT.
#                                E o COMMENT que o Genie le para escolher coluna
#
# Cada tarefa nova entra com `depends_on` na anterior: nada de bronze antes da
# conferencia dizer que o arquivo chegou, nada de silver antes da bronze existir.
#
# Tudo serverless: este e um workspace Free Edition, nunca configure cluster.
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: >-
        Pipeline da Rota Perfume: do arquivo no Volume ate a tabela de negocio.
        Entregas 1 a 4 -- conferencia do raw, carga da bronze, limpeza silver
        com contrato em CHECK constraint, e a gold modelada para consumo com
        9 testes que interrompem o job.

      tasks:
        - task_key: raw_conferencia
          description: >-
            Confere que os 10 CSVs chegaram ao Volume e nao vieram vazios,
            registra bronze._raw_arquivos e falha o job se algo faltar.
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: bronze_ingestao
          description: >-
            Le os 10 CSVs do Volume e grava 10 tabelas bronze (toda coluna
            STRING, mais _arquivo_origem e _ingerido_em). Falha se a contagem
            nao fechar com bronze._raw_arquivos.
          depends_on:
            # Nada de bronze antes da conferencia dizer que o arquivo chegou.
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        # As quatro tarefas silver dependem so da bronze, nao umas das outras --
        # entao rodam EM PARALELO, e o DAG desenha isso como um leque na tela.
        #
        # O SQL escreve o caminho completo (lakehouse_rotaperfume.silver.x) de
        # proposito: sql_task nao substitui identificador por parametro, e SQL
        # legivel vale mais numa aula do que IDENTIFIER(:catalog || '.silver.x').
        - task_key: silver_clientes
          description: >-
            Normaliza CNPJ para 14 digitos, padroniza razao social, converte as
            datas dos dois formatos e deduplica 40 CNPJs repetidos mantendo o
            cadastro mais antigo. 3.040 cadastros viram 3.000 clientes.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_pedidos
          description: >-
            Tipa valores, converte 3.443 datas em dd/MM/yyyy e torna o
            cancelamento explicito em coluna, com valor_liquido zerado.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_itens_produtos
          description: >-
            Produtos tipados e itens com devolucao SINALIZADA, nunca descartada
            (2.327 itens), mais sku_descontinuado por join com produtos.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/03-itens-e-produtos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_crm_financeiro
          description: >-
            Vendedores, carteira, oportunidades, visitas, pagamentos e estoque.
            A carteira nao conserta a orfandade: expoe as 441 carteiras abertas
            de vendedor desligado.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # A gold e ENCADEADA, ao contrario das silver: dimensao antes do fato,
        # fato antes dos marts, e os testes por ultimo. Cada etapa le a anterior.
        - task_key: gold_dimensoes
          description: >-
            As quatro dimensoes conformadas (cliente, produto, vendedor,
            calendario). Conformada = a mesma dimensao serve todos os marts,
            entao todos somam igual.
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_produtos
            - task_key: silver_crm_financeiro
          sql_task:
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_fato_vendas
          description: >-
            fato_vendas no grao de ITEM de pedido, sem cancelado e COM devolucao
            negativa e sinalizada. 191.080 linhas somando R$ 102.303.828,05 --
            o mesmo total da silver.
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_marts
          description: >-
            Tres marts sobre o MESMO fato: comercial, produto e financeiro. O
            que os separa e a dimensao dominante, nunca a tabela base.
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # NOITE 4 -- o caminho de VOLTA. Sai de gold_marts e nao do bloco de ML
        # de proposito: o app precisa da tabela existindo mesmo num dia em que o
        # modelo falhe. Roda em paralelo com `testes`.
        - task_key: gold_retorno_ligacao
          description: >-
            Cria gold.retorno_ligacao, onde o time registra o que aconteceu
            depois da ligacao. CREATE TABLE IF NOT EXISTS: e a unica tabela cujo
            dado nao vem do pipeline, e redeploy nao pode apagar resposta.
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/12-retorno-ligacao.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Por ultimo, e obrigatorio. Teste que nao quebra o job e relatorio.
        # Quando esta tarefa fica vermelha, o dashboard fica com o dado de
        # ontem -- melhor que ficar com o dado errado de hoje.
        - task_key: testes
          description: >-
            Os 9 testes de qualidade. Cada um levanta raise_error quando falha,
            e o job PARA. Se um falhar, corrija a transformacao -- nunca o teste.
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # ML e mais uma camada do mesmo pipeline, no mesmo bundle, com os mesmos
        # testes que quebram o job. Nao existe "projeto de ML" separado -- e o
        # DAG que prova isso.
        - task_key: ml_features
          description: >-
            Uma linha por cliente com tudo que se sabia dele ate uma data de
            corte que entra por parametro. A mesma funcao gera features_treino
            (com alvo) e features_cliente (sem alvo), o que torna o
            training/serving skew impossivel por construcao.
          depends_on:
            # Modelo nao se treina com dado que ainda nao passou nos testes.
            - task_key: testes
          notebook_task:
            notebook_path: ../src/ml/09-features.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ml_modelo
          description: >-
            Mede os baselines ANTES de treinar, treina o HistGradientBoosting,
            registra no Unity Catalog com alias @prod e pontua os clientes. Tem
            tres assert que interrompem a tarefa -- inclusive um que quebra se o
            AUC vier alto demais, porque vazamento chega com elogio, nao com erro.
          depends_on:
            - task_key: ml_features
          notebook_task:
            notebook_path: ../src/ml/10-modelo.py
            base_parameters:
              catalog: ${var.catalog}

        # O ultimo metro: score nao e decisao. Aqui ele vira uma lista com nome,
        # motivo em portugues e o que oferecer -- e quatro funcoes no catalogo
        # que o agente consulta em vez de inventar.
        - task_key: ml_fila
          description: >-
            Monta gold.fila_semanal (200 ligacoes, carteira vigente, filtro
            ANTES do LIMIT), cria as quatro ferramentas como funcoes SQL no UC e
            roda tres testes que quebram o job.
          depends_on:
            - task_key: ml_modelo
          sql_task:
            file:
              path: ../src/ml/11-fila.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # A ULTIMA tarefa do job, depois de tudo estar criado -- so assim ela
        # enxerga fila_semanal e retorno_ligacao. Metadado faltando e BUG, nao
        # pendencia de documentacao: sem COMMENT o Genie escolhe a coluna errada
        # e o dashboard mostra um nome que ninguem sabe o que significa.
        - task_key: auditoria_de_metadado
          description: >-
            Varre o information_schema e QUEBRA o job se alguma tabela ou coluna
            da gold estiver sem COMMENT. A mensagem de erro nomeia tabela.coluna.
          depends_on:
            - task_key: ml_fila
            - task_key: gold_retorno_ligacao
          sql_task:
            file:
              path: ../src/gold/13-auditoria-metadado.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

      schedule:
        # 6h da manha, horario de Brasilia. Em dev o preset
        # `trigger_pause_status: PAUSED` (databricks.yml) mantem isso pausado.
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: America/Sao_Paulo

      # Uma execucao por vez: conferencia concorrente so gera confusao no log.
      max_concurrent_runs: 1
