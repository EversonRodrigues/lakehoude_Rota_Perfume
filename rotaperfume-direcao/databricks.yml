bundle:
  name: rotaperfume-direcao

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: Default Genie Space ID
  genie_space_name:
    description: Genie Space display name

resources:
  apps:
    app:
      name: 'rotaperfume-direcao'
      description: 'A fila dos 200 na tela do diretor'
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  # ATENCAO: o target deste app e `default`, nunca `dev`.
  #
  # Nao ha host aqui, e nao e esquecimento: `workspace.host` e resolvido ANTES
  # das variaveis (e configuracao de autenticacao), entao `${var...}` ali falha.
  # Quem informa o workspace e o `--profile`, lido do ~/.databrickscfg.
  #
  # O warehouse e o id do Genie space vem de
  # .databricks/bundle/default/variable-overrides.json, que o git ignora.
  # Crie-o com `npm run configurar` a partir de variable-overrides.exemplo.json.
  default:
    default: true
